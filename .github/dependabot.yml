version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Stay on TypeScript 5.8. TypeScript 6/7 is out of scope.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Vite 8 and plugin-react 6 need electron-vite 6, which is still beta.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
