name: Desktop release build

# One-shot builder for the 0.4.0 Mac artifacts. electron-builder only
# produces a DMG on macOS (hdiutil + ad-hoc codesign). Removed after the
# release assets are downloaded; not part of the version bump.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/release-0-4-0-7fa7

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: mac-0.4.0
          if-no-files-found: error
          path: |
            releases/0.4.0/*.dmg
            releases/0.4.0/*.zip
