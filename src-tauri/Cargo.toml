[package]
name = "grokbar"
version = "0.1.0"
description = "CodexBar-like Grok Bot stats tray app."
authors = ["you"]
edition = "2021"
rust-version = "1.85"
resolver = "3"

[lib]
name = "grokbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
